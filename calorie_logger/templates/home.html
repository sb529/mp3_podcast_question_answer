<!DOCTYPE html>
<html>
<head>
    <title>Calorie Logger</title>
</head>
<body>
    <h1>Calorie Logger</h1>
    <form action="/log" method="POST">
        <label for="user_id">User ID:</label>
        <input type="number" name="user_id" required>
        <label for="calories">Calories:</label>
        <input type="number" name="calories" required>
        <button type="submit">Log Calories</button>
    </form>
    <h2>Users</h2>
    <ul>
        {% for user in users %}
            <li><a href="{{ url_for('progress', user_id=user.id) }}">{{ user.username }} - {{ user.points }} points, Streak: {{ user.streak }}</a></li>
        {% endfor %}
    </ul>
</body>
</html>
